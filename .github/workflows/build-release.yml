name: build-and-release

# On tag push (v*) build the Android APK + ESP32-S3 firmware and publish a GitHub
# Release with all binaries attached. Can also be started manually from the
# Actions tab (Run workflow).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1); leave empty to only build artifacts'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ---------------- Android App ----------------
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      # ⚠ 用 action 的新大版本：checkout@v4 / setup-java@v4 是 Node 20 时代的东西，
      #   runner 强制切到 Node 24 之后会报警甚至直接挂（见下面 setup-android 的说明）。
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ⚠ 不再用 android-actions/setup-android@v3：
      #   它是 Node 20 的 action，在 Node 24 的 runner 上**直接失败**
      #   （android-actions/setup-android issue #515），而且 ubuntu-latest 镜像
      #   本来就带 Android SDK —— 用它自带的 sdkmanager 缺什么补什么更可靠。
      - name: Install Android SDK packages
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM=$(find "$SDK" -name sdkmanager -type f | head -1); fi
          [ -x "$SM" ] || { echo "找不到 sdkmanager"; exit 1; }
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK"       >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK"   >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: StageDMX
        run: gradle --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p dist
          cp StageDMX/app/build/outputs/apk/debug/app-debug.apk dist/StageDMX.apk
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: StageDMX-apk
          path: dist/StageDMX.apk

  # ---------------- ESP32-S3 firmware ----------------
  firmware:
    name: Build ESP32-S3 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 直接用 espressif 官方安装脚本装 ESP-IDF（不用 esp-idf-ci-action：
      # 其预构建容器对 v5.5.x 支持不稳，且这层薄封装里失败原因不可见）
      - name: Install ESP-IDF v5.5.2
        run: |
          set -e
          git clone -b v5.5.2 --depth 1 --recursive --shallow-submodules \
            https://github.com/espressif/esp-idf.git "$HOME/esp/esp-idf"
          "$HOME/esp/esp-idf/install.sh" esp32s3
          # 给后续 step 暴露 idf.py
          echo "$HOME/esp/esp-idf/tools" >> "$GITHUB_PATH"

      - name: Build firmware
        working-directory: stagedmx_std
        run: |
          . "$HOME/esp/esp-idf/export.sh"
          idf.py build

      - name: Collect firmware binaries
        run: |
          ls -l stagedmx_std/build
          mkdir -p dist
          cp stagedmx_std/build/bootloader/bootloader.bin          dist/bootloader.bin
          cp stagedmx_std/build/partition_table/partition-table.bin dist/partition-table.bin
          cp stagedmx_std/build/stagedmx.bin                       dist/stagedmx.bin
          ls -l dist
          cat > dist/FLASH-README.txt <<'EOF'
          StageDMX firmware flashing (ESP32-S3, 16MB flash; adjust COM port)
            esptool.py --chip esp32s3 -p COM13 -b 460800 write_flash --flash_mode dio --flash_size 16MB --flash_freq 80m 0x0 bootloader.bin 0x8000 partition-table.bin 0x10000 stagedmx.bin

          WIRING -- CHANGED in this release (two SP3485EN, both RO wired back, one DE each)
            Universe 1:  DI=GPIO17   RO=GPIO18   DE=GPIO4
            Universe 2:  DI=GPIO16   RO=GPIO15   DE=GPIO5
            * tie /RE to DE on the bare SP3485EN -- a permanently enabled receiver
              hears its own transmission (echo) and produces false breaks
            * never swap DI and RO: both are outputs, they will fight and overheat
            * GPIO2 is no longer used
            Full notes: see this release's description (repo file RELEASE_NOTES.md)

          Reset fixture filesystem if needed:
            esptool.py --chip esp32s3 -p COM13 erase_region 0x310000 0x200000

          Install the Android app:
            adb install -r StageDMX.apk
          EOF
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: stagedmx-firmware
          path: dist/*

  # ---------------- Publish release ----------------
  release:
    name: Publish Release
    needs: [android, firmware]
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      # ⚠ 必须先 checkout：Release 正文取自仓库里的 RELEASE_NOTES.md（下面的 body_path）。
      #   不 checkout 就没有这个文件 —— action 会**静默用空正文**建 Release。
      #   v1.26 第一次发布就踩到了：产物都对，说明是空的，只能修完重发。
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          find dist -mindepth 2 -type f -exec cp {} dist/ \;
          find dist -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          ls -l dist

      - name: Determine tag
        id: t
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      # ⚠ 用 gh CLI 而不是 softprops/action-gh-release：
      #   那个 action 对**已存在**的 Release 不会写正文（v1.26 踩过：产物都对、说明是空的，
      #   而且它只是静默跳过，job 仍然 success —— 最难查的那种）。
      #   这里显式区分"已存在就 edit / 否则 create"，正文永远取自 RELEASE_NOTES.md。
      - name: Publish Release (gh CLI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ steps.t.outputs.tag }}"
          TITLE="StageDMX $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在 → 更新标题与正文"
            gh release edit "$TAG" --title "$TITLE" --notes-file RELEASE_NOTES.md
          else
            echo "Release $TAG 不存在 → 新建"
            gh release create "$TAG" --title "$TITLE" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$TAG" dist/* --clobber
          echo "---- 结果 ----"
          gh release view "$TAG" --json name,tagName,url,assets
